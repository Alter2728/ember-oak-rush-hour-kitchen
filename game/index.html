<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember &amp; Oak — Rush Hour Kitchen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="bar">
    <span>Ember &amp; Oak — Rush Hour Kitchen</span>
    <button id="mute" type="button">🔊 Sound on</button>
  </div>
  <p id="help">Move with WASD or arrows. Press E (or click a station) to interact — hold E to chop.
  Grab ingredients at the pantry (click a crate or press 1–7), chop them, cook them, plate them,
  serve them before the ticket runs out. P pauses, M mutes, R restarts after a shift.</p>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
